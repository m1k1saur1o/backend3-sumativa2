spring.application.name=ms-bff
server.port=8080

# Unico lugar donde se configura la URL del microservicio de datos.
data-service.url=http://localhost:8081

# Timeouts al llamar a ms-backend: si no responde a tiempo, el BFF falla
# rapido en vez de dejar la solicitud esperando indefinidamente.
data-service.connect-timeout-ms=2000
data-service.read-timeout-ms=3000

logging.level.cl.duoc.sumativa2.bff=DEBUG
