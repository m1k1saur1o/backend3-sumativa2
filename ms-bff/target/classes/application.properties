spring.application.name=ms-bff
server.port=${SERVER_PORT:8080}

# Unico lugar donde se configura la URL del microservicio de datos. Es un nombre logico:
# Spring Cloud LoadBalancer lo resuelve contra Eureka y reparte entre las replicas de ms-backend.
# DATA_SERVICE_URL permite cambiarlo sin recompilar (ej. otro nombre de servicio).
data-service.url=${DATA_SERVICE_URL:http://ms-backend}

# Timeouts al llamar a ms-backend: si no responde a tiempo, el BFF falla
# rapido en vez de dejar la solicitud esperando indefinidamente.
data-service.connect-timeout-ms=${DATA_SERVICE_CONNECT_TIMEOUT_MS:2000}
data-service.read-timeout-ms=${DATA_SERVICE_READ_TIMEOUT_MS:3000}

# ---------- Seguridad: JWT emitido por auth-service (OAuth2 Resource Server) ----------
# JWT_SECRET es obligatorio y debe ser identico al de auth-service (sin valor por defecto).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:sumativa3-auth-service}
app.jwt.audience=${BFF_JWT_AUDIENCE:bff-api}

# ---------- Auditoria de llamadas (evento BffCallEvent v1 -> producer-service -> Kafka) ----------
app.auditoria.enabled=${AUDIT_ENABLED:true}
app.auditoria.producer-url=${AUDIT_PRODUCER_URL:http://producer-service}
app.auditoria.auth-url=${AUTH_SERVICE_URL:http://auth-service}
app.auditoria.client-id=${AUTH_CLIENT_ID:}
app.auditoria.client-secret=${AUTH_CLIENT_SECRET:}
app.auditoria.connect-timeout=${AUDIT_CONNECT_TIMEOUT_MS:1000}ms
app.auditoria.read-timeout=${AUDIT_READ_TIMEOUT_MS:20000}ms
app.auditoria.threads=${AUDIT_THREADS:2}
app.auditoria.queue-capacity=${AUDIT_QUEUE_CAPACITY:1000}

# ---------- Eureka (registro y descubrimiento) ----------
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_SECONDS:10}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/health

# ---------- Spring Cloud LoadBalancer ----------
# Round robin entre instancias UP. Reintento limitado: 0 en la misma instancia y 1 en otra, solo
# para GET (idempotentes) y ante errores de conexion/timeout o 502/503/504 de la replica.
spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.retry-on-all-operations=false
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=0
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=1
spring.cloud.loadbalancer.retry.retryable-status-codes=502,503,504
# Cache corta de la lista de instancias para enterarse rapido de replicas nuevas o caidas
spring.cloud.loadbalancer.cache.ttl=10s

# ---------- Resilience4j ----------
# msBackend: con >= 50 % de fallas de disponibilidad (min. 5 llamadas en ventana de 10) el circuito
# se abre 15 s y el BFF responde 503 de inmediato. 404/400 no cuentan como falla.
resilience4j.circuitbreaker.instances.msBackend.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msBackend.sliding-window-size=${CB_MS_BACKEND_WINDOW:10}
resilience4j.circuitbreaker.instances.msBackend.minimum-number-of-calls=${CB_MS_BACKEND_MIN_CALLS:5}
resilience4j.circuitbreaker.instances.msBackend.failure-rate-threshold=${CB_MS_BACKEND_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.msBackend.wait-duration-in-open-state=${CB_MS_BACKEND_WAIT_OPEN_SECONDS:15}s
resilience4j.circuitbreaker.instances.msBackend.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msBackend.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msBackend.record-exceptions=cl.duoc.sumativa2.bff.exceptions.ServicioDatosNoDisponibleException
# auditoria: protege los hilos de publicacion si producer-service, auth-service o Kafka no responden
resilience4j.circuitbreaker.instances.auditoria.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.auditoria.sliding-window-size=10
resilience4j.circuitbreaker.instances.auditoria.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.auditoria.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.auditoria.wait-duration-in-open-state=${CB_AUDITORIA_WAIT_OPEN_SECONDS:30}s
resilience4j.circuitbreaker.instances.auditoria.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.auditoria.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.auditoria.record-exceptions=cl.duoc.sumativa2.bff.auditoria.AuditoriaNoDisponibleException

# ---------- Actuator: solo health, publico y sin detalles ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

server.error.include-stacktrace=never
server.error.include-message=never

logging.level.cl.duoc.sumativa2.bff=${LOG_LEVEL_APP:DEBUG}
logging.pattern.level=%5p [%X{requestId:-}]
