# Levanta ms-backend + ms-bff. Los datos se leen del contenedor MySQL ya
# existente (mysql-dev, publicado en el puerto 3306 del host): este compose
# NO crea otra base de datos.
# Puertos del host elegidos para no chocar con 8080/8081 ya en uso;
# se pueden cambiar con variables de entorno (ej: BFF_PORT=19080 docker compose up -d).
name: sumativa2

services:
  ms-backend:
    build: ./ms-backend
    image: sumativa2/ms-backend:1.0.0
    container_name: sumativa2-ms-backend
    environment:
      # Desde un contenedor "localhost" es el propio contenedor; host.docker.internal
      # apunta a la maquina anfitriona, donde mysql-dev publica el 3306.
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${MYSQL_HOST_PORT:-3306}/myapp
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-18081}:8081"
    restart: on-failure

  ms-bff:
    build: ./ms-bff
    image: sumativa2/ms-bff:1.0.0
    container_name: sumativa2-ms-bff
    environment:
      DATA_SERVICE_URL: http://ms-backend:8081
    ports:
      - "${BFF_PORT:-18080}:8080"
    depends_on:
      - ms-backend
