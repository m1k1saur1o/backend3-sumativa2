spring.application.name=ms-backend
server.port=${SERVER_PORT:8081}

# Base de datos MySQL (contenedor Docker ya existente). Las credenciales no se versionan:
# se entregan por variables de entorno (DB_USERNAME / DB_PASSWORD, o SPRING_DATASOURCE_* en Docker).
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/myapp}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo administra la base de datos: este microservicio solo lee.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- Eureka (registro en discovery-service) ----------
# Cada replica se registra con su IP de la red Docker; ms-bff las balancea con Spring Cloud LoadBalancer.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=false
# Propaga el estado de /actuator/health (incluye MySQL) a Eureka: una replica sin BD queda DOWN
# y ms-bff deja de enviarle trafico.
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/health

# Access log opcional a stdout (ACCESS_LOG_ENABLED=true): muestra que replica atendio cada
# solicitud y su X-Request-Id, util para verificar el balanceo desde ms-bff.
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:false}
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.pattern=ACCESS %{yyyy-MM-dd'T'HH:mm:ss.SSSZ}t "%r" %s %{ms}Tms requestId=%{X-Request-Id}i

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.level.cl.duoc.sumativa2.backend=${LOG_LEVEL_APP:DEBUG}
