spring.application.name=ms-backend
server.port=8081

# Base de datos MySQL local (contenedor Docker ya existente).
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/myapp
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo administra la base de datos: este microservicio solo lee.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

logging.level.cl.duoc.sumativa2.backend=DEBUG
